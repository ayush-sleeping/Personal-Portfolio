name: Liveness — published site

# Proves the live site is actually being served, daily. deploy.yml proves a build can be published;
# this catches what happens after: a broken Pages deploy, a wrong path after a rename, or a page
# that is served but empty.
#
# v3 is a static export with the sheet content written into the HTML; it no longer publishes
# assets/data/. So this checks the page itself: the site root has the name and every section,
# and one of v2's old .html pages still answers (its redirect stub).

on:
  schedule:
    - cron: '17 6 * * *'    # daily, off the hour to avoid the cron rush
  workflow_dispatch:
    inputs:
      base:
        description: Site URL to check instead of this repo's Pages URL (e.g. a preview).
        type: string
        required: false
        default: ""

concurrency:
  group: liveness
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The site to check. Empty = this repo's own Pages URL, worked out in the step below:
  # https://<owner>.github.io/<repo> for a project site (now: /Personal-Portfolio), the bare
  # https://<owner>.github.io once the repo is named <owner>.github.io (task.md T9). So, like
  # deploy.yml, it needs no edit at the rename. A manual run can point it anywhere.
  BASE: ${{ inputs.base }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the site root and an old page
        run: |
          set -uo pipefail
          fail=0

          if [ -z "$BASE" ]; then
            owner=$(printf %s "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
            repo="${GITHUB_REPOSITORY#*/}"
            if [ "$(printf %s "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
              BASE="https://$owner.github.io"
            else
              BASE="https://$owner.github.io/$repo"
            fi
          fi
          BASE="${BASE%/}"
          echo "Checking $BASE"

          # fetch <path> <file>: follows redirects, fails on anything but a 200.
          fetch() {
            local code
            # curl prints 000 itself when it can't connect; `|| true` keeps that single 000.
            code=$(curl -sS -L -o "$2" -w '%{http_code}' --max-time 20 "$BASE/$1") || true
            if [ "$code" != "200" ]; then
              echo "::error::$BASE/$1 returned HTTP $code"
              return 1
            fi
            echo "ok  $BASE/$1 ($(wc -c < "$2") bytes)"
          }

          # A 200 is not enough: Pages can serve an empty or wrong page with a 200, so check the
          # content the static export writes into the HTML.
          if fetch "" /tmp/root.html; then
            if ! grep -q 'Ayush Mishra' /tmp/root.html; then
              echo "::error::the site root has no \"Ayush Mishra\""
              fail=1
            fi
            for id in home about projects services contact; do
              if ! grep -q "id=\"$id\"" /tmp/root.html; then
                echo "::error::the site root has no section id=\"$id\""
                fail=1
              fi
            done
          else
            fail=1
          fi

          # v2's about.html is now a redirect stub to the About section.
          if fetch about.html /tmp/about.html; then
            if ! grep -q '#about' /tmp/about.html; then
              echo "::error::about.html doesn't point at #about"
              fail=1
            fi
          else
            fail=1
          fi

          exit $fail
