name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes out/ to GitHub Pages (task.md Phase 10).
#
# Three ways in:
#   - After CI ("CI (v3 Next.js)", ci.yml) finishes green for a push to main (workflow_run). A
#     commit that fails its checks never goes live. Not on push itself: that would race CI and
#     deploy whatever was pushed. A green PR or v3-nextjs run doesn't deploy, and a CI re-run that
#     turns green does. workflow_run only fires from the default branch's copy of this file, so
#     this path can't be exercised before the cutover (task.md 10C).
#   - By hand (workflow_dispatch), from the branch it's run on.
#   - Called by refresh-content.yml after a content commit (workflow_call), because a push made
#     with GITHUB_TOKEN triggers no workflow (not even CI). The data is validated before that
#     commit and again by the build's prebuild step.
#
# The URL prefix comes from actions/configure-pages: its base_path output is "/Personal-Portfolio"
# while the repo has that name, and "" once it's renamed to ayush-sleeping.github.io (task.md T9).
# next.config.ts and lib/site.ts read the same NEXT_PUBLIC_BASE_PATH, so this file needs no
# change at the rename.
#
# Needs the repo's Pages source set to "GitHub Actions" (task.md 10C).

on:
  workflow_run:
    workflows: ["CI (v3 Next.js)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. The caller's own commit when empty.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued one waits rather than cancelling one in flight, so a
# half-uploaded site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After CI, only a green run for a push (not a pull request) deploys.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit to publish: a caller passes the one it just pushed (its own github.sha is the
          # commit before it); after CI, the commit CI checked (github.sha is then the branch tip,
          # which may be newer and unchecked); by hand, the branch's commit.
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
